# arnoandaivengo.ru — доп. директивы nginx (ISPmanager или server block)
# Сайт статический: PHP не нужен.

error_page 404 /404.html;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

location ^~ /projects/crypto {
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.coingecko.com https://api.rss2json.com wss://stream.binance.com:9443 https://stream.binance.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}

location ^~ /projects/saas-dashboard {
  try_files $uri $uri/ /projects/saas-dashboard/200.html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}

location ^~ /projects/ai-chat {
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}

location /api/coingecko/ {
  proxy_pass https://api.coingecko.com/api/v3/;
  proxy_ssl_server_name on;
  proxy_set_header Host api.coingecko.com;
}

# Сайт статический: любой PHP — 404. Exact `=` важнее, чем ISPmanager `location ~ \.php$`.
location = /wp-login.php { return 404; }
location = /xmlrpc.php { return 404; }
location = /mail.php { return 404; }
location = /send.php { return 404; }
location = /contact.php { return 404; }
location ~ \.php$ { return 404; }

location ^~ /wp-admin { return 404; }
location ^~ /wp-includes { return 404; }
location ^~ /wp-content { return 404; }
location ^~ /wp-login { return 404; }
location ^~ /admin { return 404; }

location = /.git/config { return 404; }
location ^~ /.git { return 404; }
