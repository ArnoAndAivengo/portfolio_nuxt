lead: "Реализую проекты любой сложности и направления — от лёгкого одностраничника до сложного SPA. Также занимаюсь поддержкой уже готовых проектов."
intro: "Основной стек: Vue 3, Nuxt, TypeScript. Возможно сделать проект на React, Next или Angular — обсуждается отдельно. Также работаю со смежным контуром frontend → backend → деплой. Можно прийти с идеей или с готовым макетом. Ниже — форматы работ с примерами из портфолио."
offers:
  - title: "Своя идея — до полного проекта"
    text: "Можете принести сырую идею: «хочу вот такое и большое». Ок — опишем, сузим до задачи, декомпозируем на подзадачи и доведём до рабочего продукта."
    examples:
      - label: "LearnPortal"
        href: "/projects/learn-portal"
      - label: "Codestats"
        href: "/projects/codestats"
  - title: "Pixel Perfect по макету"
    text: "Если есть готовый макет в Figma — сверстаю один в один: сетка, отступы, типографика, состояния, адаптив. Без «примерно как на картинке» — пиксель в пиксель."
  - title: "Лендинги и одностраничники"
    text: "Сайт-визитка, лендинг, портфолио. Адаптив, понятная структура, базовая SEO, статическая сборка. Этот сайт — как раз такой случай."
    examples:
      - label: "Этот сайт"
        href: "/"
  - title: "Каталоги и витрины"
    text: "Карточки, фильтры, пагинация, каталог товаров или услуг. Не шаблонная витрина, а интерфейс, в котором удобно искать и листать."
    examples:
      - label: "Market (Т1)"
        href: "https://gitlab.com/ArnoAndAivengo/market_laravel_vue"
      - label: "SPA-каталог"
        href: "https://gitlab.com/ArnoAndAivengo/react_spa_catalog"
      - label: "Рейтинг нейросетей"
        href: "/projects/ai/"
        external: true
  - title: "Дашборды и данные в реальном времени"
    text: "Метрики, графики, инциденты, обновление по WebSocket. Когда нужно видеть цифры и состояние сервиса, а не статичную страницу."
    examples:
      - label: "Crypto Dashboard"
        href: "/projects/crypto/"
        external: true
      - label: "SaaS Metrics Hub"
        href: "/projects/saas-dashboard/"
        external: true
  - title: "Чаты и интеграции с API"
    text: "Интерфейс чата, подключение LLM и внешних сервисов. От простого диалога до экрана, который живёт на чужом API."
    examples:
      - label: "AI Chat"
        href: "/projects/ai-chat/"
        external: true
  - title: "Личные кабинеты и авторизация"
    text: "Регистрация, роли, профили, избранное, настройки. Кабинет как часть продукта, а не форма логина на лендинге."
    examples:
      - label: "Imtera"
        href: "https://gitlab.com/ArnoAndAivengo/imtera-yandex-parsing"
  - title: "Полноценные продукты"
    text: "Сложная логика, авторизация, бэкенд и деплой. От архитектуры до релиза — как LearnPortal и Codestats."
    examples:
      - label: "LearnPortal"
        href: "/projects/learn-portal"
      - label: "Codestats"
        href: "/projects/codestats"
  - title: "Доработка и поддержка"
    text: "Уже есть сайт: нужно починить, добавить фичу, обновить зависимости или просто не дать ему развалиться. Разберусь в чужом коде и продолжу."
  - title: "Рефакторинг legacy"
    text: "Перевод на Vue 3 / Nuxt / TypeScript, FSD, разбор старого кода."
  - title: "SEO, SSR и скорость"
    text: "Индексация, серверный рендер, code splitting, Core Web Vitals. Когда страница должна открываться быстро и находиться в поиске."
    examples:
      - label: "Этот сайт"
        href: "/"
  - title: "Админ-панели и сложные таблицы"
    text: "Фильтры, пагинация, виртуализация длинных списков, графики. Чтобы данные можно было смотреть и править."
    examples:
      - label: "SaaS Metrics Hub"
        href: "/projects/saas-dashboard/"
        external: true
  - title: "Карты и гео"
    text: "Метки, фильтры по географии, слои на карте. Leaflet / OpenLayers — когда продукт живёт на карте."
  - title: "Парсинг и сбор данных"
    text: "Сбор с внешних источников, сохранение в базу, кабинет для просмотра."
    examples:
      - label: "Imtera"
        href: "https://gitlab.com/ArnoAndAivengo/imtera-yandex-parsing"
  - title: "CI/CD и деплой"
    text: "Сборка, тесты, выкатка: GitHub Actions / GitLab CI, Docker, Nginx. Чтобы доставка в прод занимала минуты."
  - title: "Автотесты"
    text: "Vitest и Playwright на критических сценариях. Релиз не должен ломать то, что уже работает."
  - title: "Многоязычность"
    text: "i18n: русский, английский и дальше. Интерфейс, даты, ошибки — один код, несколько языков."
  - title: "Консультация по архитектуре"
    text: "Спроектирую FSD-архитектуру для сложных проектов: слои, границы, узкие места."
processLead: "Любой проект — от сырой идеи до релиза — идёт строго по наработанной методологии разработки. Проекты разные соответственно и подход к каждому проекту будет свой. Поставлю понятные задачи, подберу современный стек, реализую тесты в pipeline, сделаю предсказуемую выкатку."
process:
  - title: "Идея и рамка"
    items:
      - "Уточняю, что нужно на самом деле, а не только фразу «хочу сайт»."
      - "Фиксирую цель, аудиторию, ограничения: срок, объём, платформы, что уже есть на руках."
      - "Сырую мысль сужаю до одной ценности, которую можно выпустить, а не до бесконечного «ещё вот это»."
  - title: "Требования и декомпозиция"
    items:
      - "Описываю сценарии: кто приходит, что делает, какой результат считает успехом."
      - "Договариваемся о Definition of Done (Определение готовности): когда задача не «почти», а сдана."
      - "Режем на маленькие подзадачи, которые можно показывать по очереди."
      - "Отделяем must-have от «было бы неплохо», чтобы релиз не утонул в хотелках."
  - title: "Дизайн и прототип"
    items:
      - "Есть макет в Figma — Pixel Perfect: сетка, отступы, состояния, адаптив, пиксель в пиксель."
      - "Макета нет — простая структура, читаемая типографика, контраст. Не рисуем «дизайн ради дизайна»."
      - "Согласовываем ключевые экраны до большой разработки, чтобы не переписывать всё в конце."
  - title: "Архитектура и современный стек"
    items:
      - "Клиент: Vue 3 (Composition API), Nuxt, TypeScript, Vite, Pinia, Vue Router."
      - "Структура: Feature-Sliced Design — слои features / entities / shared, чтобы фичи не пересекались."
      - "Стиль: Tailwind или CSS-переменные (BEM), адаптив, тёмная и светлая тема, если нужна."
      - "Контракт API: REST, GraphQL или OpenAPI, клиент по схеме, без ручного угадывания полей."
      - "По задаче закрываю смежный контур: NestJS, PostgreSQL, Redis, Docker, Nginx — без смены экспертизы с фронта."
  - title: "Репозиторий и инженерный контур"
    items:
      - "Git с понятной историей, ветки под задачи, code review до основной ветки."
      - "ESLint, TypeScript в строгом режиме, единый стиль — ошибки ловим до ревью, не в проде."
      - "README: как запустить локально, как прогнать тесты, как собрать и выкатить."
      - "Секреты и окружения не в репозитории: .env, переменные CI, разные контуры dev / staging / prod."
  - title: "Разработка"
    items:
      - "Итерации: каркас → сценарии → полировка. Сначала работает путь пользователя, потом украшения."
      - "Компоненты, состояние, формы, ошибки, пустые экраны."
      - "Адаптив с первой вёрстки."
      - "Не копим TODO до релиза. Если откладываем — это осознанный долг."
  - title: "Тесты и покрытие"
    items:
      - "Unit: Vitest — composables, утилиты, сложная логика, компоненты, которые легко сломать."
      - "E2E: Playwright — критический путь: открыл, сделал главное, увидел результат. Для кабинета — вход и ключевой сценарий."
      - "Покрываем то, что дорого чинить на проде."
      - "Тесты живут в CI: красный pipeline — нет мержа и нет выкатки. Релиз без зелёных проверок не считается релизом."
      - "Регрессии ловим до пользователя."
  - title: "Качество: доступность, SEO, скорость"
    items:
      - "Семантика, клавиатура, фокус, контраст, подписи к контролам — страница должна работать не только мышью."
      - "Если нужна выдача в поиске: SSR, мета, sitemap, канонические URL, нормальный title и description."
      - "Скорость: code splitting, lazy loading, виртуализация длинных списков, Core Web Vitals — когда от этого зависит продукт."
      - "UI-kit в Storybook — если экранов много и компоненты будут жить дольше одной страницы."
  - title: "CI/CD"
    items:
      - "GitHub Actions или GitLab CI: lint, typecheck, unit, e2e, сборка — одним пайплайном."
      - "Артефакт для прода: статика Nuxt generate или контейнер Docker + Nginx."
      - "Выкатка минуты, не ручной вечер с FTP и «у меня локально работает»."
  - title: "Staging и приёмка"
    items:
      - "Смотрим на стенде, близком к проду: те же сборка, переменные, домен-превью."
      - "Прогон сценариев из DoD, правки по списку — не бесконечный поток «ещё вот это» в день релиза."
      - "Согласование: «можно в прод» — отдельное решение, не «уже запушил, живи»."
  - title: "Релиз"
    items:
      - "Прод: HTTPS, окружение, домен, роботы, favicon, 404, редиректы со старых URL, если они были."
      - "Смоук на живом адресе: главные экраны, формы, авторизация — глазами и автотестами."
      - "План отката: предыдущая сборка под рукой, чтобы не чинить прод горячими патчами в панике."
  - title: "После релиза"
    items:
      - "Короткие правки, баги, мелочи, которые всплывают только на реальных людях."
      - "Мониторинг и логи — если сервису нужна жизнь после открытия вкладки."
      - "Как развивать дальше: что в бэклоге, что не трогать, где лежит документация."
contactLead: "Напишите, что нужно сделать, или опишите идею — разберём и доведём до реального проекта."
