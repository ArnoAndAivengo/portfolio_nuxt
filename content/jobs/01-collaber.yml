duties:
  - label: О продукте
    text: "collaber.ru — платформа прямых коллабораций и взаимного маркетинга: компании, инфлюенсеры и кинопроекты находят партнёров по гео, аудитории и задачам, договариваются бартером, взаимно или платно."
  - label: Frontend-архитектура
    text: Nuxt 3 (SPA) + Vue 3 + TypeScript, переход на FSD (widgets / features / entities / shared), Pinia и TanStack Query, клиент по OpenAPI, Docker для локального контура.
  - label: Продуктовые сценарии
    text: лента и каталог компаний, создание и управление офферами, профили и рекламный инвентарь, избранное, настройки, подписка и оплата (ЮKassa).
  - label: Real-time и UI
    text: чаты на Laravel Echo, карты Leaflet, Tailwind + shadcn-vue + Element Plus, i18n, GitFlow (develop / qa / main), ESLint / Stylelint / Husky.
  - label: Интеграция с API
    text: клиент по OpenAPI, экраны под контракт Laravel. Backend понимаю на уровне эндпоинтов — основная зона ответственности клиент.
