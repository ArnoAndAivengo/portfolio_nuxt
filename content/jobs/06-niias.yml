teaser: "SPA для управления ж/д инфраструктурой: интерактивные карты на OpenLayers 3 (слои, клики, фильтры), клиентская бизнес-логика, интеграция с REST и GraphQL."
duties:
  - text: "Разработка UI SPA на JavaScript (ES6+), ExtJS 4–6, React и Vue (Nuxt): клиентская логика, компоненты, маршрутизация, интеграция с backend."
  - text: "Бизнес-логика по BLL: функциональное программирование, алгоритмы обработки данных и состояний интерфейса."
  - text: "Работа с серверными запросами: GET/POST, AJAX, REST, взаимодействие с API, обработка ответов."
  - text: "Верстка и стилизация: Flex, Grid, Bootstrap, Ant Design, Material-библиотеки."
  - text: "Рефакторинг и отладка: устранение багов, стабильность и читаемость кода."
  - text: "Интерактивные карты на OpenLayers 3: слои и объекты (дороги, перегоны, города), визуализация и аналитический вывод."
  - text: UI для навигации, фильтрации и работы с геоданными на карте.
results:
  - Разработка и поддержка UI нескольких SPA на ExtJS и React — стабильная работа в продакшене.
  - Сложные алгоритмы и бизнес-логика на фронтенде — соответствие требованиям предметной области.
  - Надёжное взаимодействие с backend через REST/AJAX — предсказуемость и устойчивость обмена данными.
  - Интерактивные карты Ж/Д на OpenLayers 3 с логическим выводом аналитики — упрощение анализа пространственных данных.
