  - label: Интеграция
    text: взаимодействие с существующим backend через REST API, согласование изменений с командой и заказчиком.
  - label: Процессы
    text: оценка сроков, техническая документация по доработкам, контроль качества правок в наследуемой кодовой базе.
results:
