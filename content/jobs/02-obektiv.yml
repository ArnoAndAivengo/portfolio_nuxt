teaser: "Дашборды на больших данных: Vue 3 + ECharts, серверная пагинация и виртуальная прокрутка. FSD + CI/CD (Playwright, Vitest) — релизы без регрессий UI."
duties:
  - label: О проекте
    text: "веб-аналитическая система для застройщиков — платформа для мониторинга ключевых показателей (воронка продаж, спрос, эффективность каналов) на основе больших данных; обработка и визуализация значительных объёмов записей, прозрачность бизнес-процессов для стейкхолдеров."
  - label: Архитектура и масштабирование
    text: спроектировал фронтенд по FSD с разделением на слои features / entities / shared — масштабируемость без регрессий, проще онбординг, единые стандарты кода для команды.
  - label: Работа с большими данными
    text: дашборды и таблицы на Vue 3 + ECharts; серверная пагинация и виртуальная прокрутка таблиц, lazy loading и кэширование API — быстрее загрузка и отклик интерфейсов.
  - label: Управление состоянием и UX
    text: интерактивные дашборды и многокритериальные фильтры на Vue 3 Composition API + Pinia — работа с большим количеством метрик без лагов и зависаний.
  - label: Качество кода и автоматизация
    text: CI/CD на Vite — автоматическая сборка и деплой, Playwright (e2e) и Vitest (unit) в pipeline; покрытие критических модулей (дашборды, фильтры) unit-тестами — ускорение деплоя, меньше регрессий при релизах.
  - label: Верстка и дизайн-система
    text: pixel-perfect лендинги и внутренние страницы — BEM, Flexbox/Grid, mobile-first, кросс-браузерная верстка, полная адаптивность.
results:
  - "Запущенные KPI-дашборды получили высокую оценку от стейкхолдеров: отмечено повышение прозрачности бизнес-решений на основе данных."
  - "Стабильная работа интерфейсов при масштабировании: расширение функциональности без деградации производительности."
  - Сокращён time-to-market новых фич за счёт автоматизированного CI/CD и модульной архитектуры.
