stages:
  - ci

ci:
  stage: ci
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run generate
    - npx playwright install --with-deps chromium
    - npm run test:e2e
